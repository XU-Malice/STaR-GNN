name: Verify STaR-GNN
on:
  push:
    branches: [main]
  pull_request:
jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . pytest
      - name: Execute model tests
        run: python -m pytest -q tests/test_star_components.py tests/test_star_gnn.py
      - name: Validate minimal forward call
        run: python examples/minimal_forward.py
